<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Unbounded";
      src: url("file:///workspace/.grok/fonts/Unbounded-Bold.ttf") format("truetype");
      font-weight: 400 900;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Manrope";
      src: url("file:///workspace/.grok/fonts/Manrope-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #141414;
    }
    .stage {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 62% 78% at 50% 46%, rgba(227, 6, 19, 0.34) 0%, rgba(20, 20, 20, 0) 64%),
        radial-gradient(ellipse 90% 40% at 50% 108%, rgba(244, 245, 247, 0.07) 0%, rgba(20, 20, 20, 0) 62%),
        #141414;
    }
    .eyebrow {
      font-family: Manrope, "DejaVu Sans", sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: #F4F5F7;
      padding-left: 0.46em;
      margin-bottom: 26px;
    }
    .ticket {
      position: relative;
      width: 880px;
      height: 332px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .ticket svg.plate {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .lockup {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }
    .word {
      font-family: Unbounded, "DejaVu Sans", sans-serif;
      font-weight: 700;
      color: #ffffff;
      line-height: 0.88;
    }
    .word.main {
      font-size: 112px;
      letter-spacing: -0.035em;
    }
    .word.sub {
      margin-top: 14px;
      font-size: 52px;
      letter-spacing: 0.34em;
      padding-left: 0.34em;
    }
    .rule {
      width: 72px;
      height: 4px;
      margin-top: 22px;
      background: #ffffff;
      border-radius: 2px;
      opacity: 0.92;
    }
    .tag {
      margin-top: 28px;
      font-family: Manrope, "DejaVu Sans", sans-serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.22em;
      color: #F4F5F7;
      padding-left: 0.22em;
    }
    .tag span { color: #E30613; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="eyebrow">Уфа · Башкортостан</div>
    <div class="ticket">
      <svg class="plate" viewBox="0 0 880 332" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <mask id="ticket">
            <rect width="880" height="332" rx="34" fill="#fff"/>
            <circle cx="0" cy="166" r="46" fill="#000"/>
            <circle cx="880" cy="166" r="46" fill="#000"/>
          </mask>
        </defs>
        <rect width="880" height="332" rx="34" fill="#E30613" mask="url(#ticket)"/>
        <g fill="#ffffff" opacity="0.55">
          <circle cx="86" cy="28" r="3.2"/>
          <circle cx="86" cy="52" r="3.2"/>
          <circle cx="86" cy="76" r="3.2"/>
          <circle cx="86" cy="100" r="3.2"/>
          <circle cx="86" cy="124" r="3.2"/>
          <circle cx="86" cy="148" r="3.2"/>
          <circle cx="86" cy="184" r="3.2"/>
          <circle cx="86" cy="208" r="3.2"/>
          <circle cx="86" cy="232" r="3.2"/>
          <circle cx="86" cy="256" r="3.2"/>
          <circle cx="86" cy="280" r="3.2"/>
          <circle cx="86" cy="304" r="3.2"/>
        </g>
      </svg>
      <div class="lockup">
        <div class="word main" id="main">АФИША</div>
        <div class="word sub">УФЫ</div>
        <div class="rule"></div>
      </div>
    </div>
    <div class="tag">концерты <span>·</span> театр <span>·</span> выставки</div>
  </div>
</body>
</html>
